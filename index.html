<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift Circuit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #eef2ff; }
  #game-canvas { position: fixed; inset: 0; display: block; }
  .hud { position: fixed; pointer-events: none; user-select: none; z-index: 10; }

  #hud-speed { left: 26px; bottom: 18px; text-shadow: 0 0 14px rgba(40,170,255,.8), 0 2px 4px #000; }
  #speed-value { font-size: 62px; font-weight: 800; line-height: 1; }
  #hud-speed small { font-size: 14px; color: #9ab; letter-spacing: 4px; }
  #boost-flag { font-size: 16px; color: #5fffb0; font-weight: 700; opacity: 0; transition: opacity .1s; }
  #boost-flag.show { opacity: 1; }

  #hud-drift { left: 50%; transform: translateX(-50%); bottom: 92px; text-align: center;
    opacity: 0; transition: opacity .15s; }
  #hud-drift.show { opacity: 1; }
  #drift-score { font-size: 32px; font-weight: 800; color: #ffd34d; text-shadow: 0 2px 8px #000; }
  #drift-combo { font-size: 18px; font-weight: 700; color: #ff9d2e; text-shadow: 0 1px 4px #000; }

  #hud-lap { top: 14px; right: 26px; text-align: right; text-shadow: 0 1px 4px #000; }
  #lap-counter { font-size: 30px; font-weight: 800; }
  #lap-times { font-size: 13px; color: #b6c6da; margin-top: 4px; line-height: 1.55; }
  #lap-times b { color: #fff; }

  #hud-pos { top: 14px; left: 26px; font-size: 46px; font-weight: 800; color: #ffd34d;
    text-shadow: 0 2px 8px #000; }
  #hud-pos small { display: block; font-size: 11px; color: #9ab; letter-spacing: 3px; }

  #hud-msg { top: 28%; left: 50%; transform: translate(-50%, -50%); font-size: 84px;
    font-weight: 800; color: #fff; text-shadow: 0 0 32px rgba(40,170,255,.9), 0 2px 6px #000;
    opacity: 0; transition: opacity .12s; white-space: nowrap; }
  #hud-msg.show { opacity: 1; }

  #hud-map { right: 20px; bottom: 18px; background: rgba(8, 12, 18, .6);
    border: 1px solid #29415a; border-radius: 8px; padding: 6px; }
  #map-canvas { display: block; }

  #hud-hint { left: 26px; top: 92px; font-size: 12px; color: #75879e; line-height: 1.75;
    text-shadow: 0 1px 2px #000; }
  #hud-hint b { color: #b9c9de; }
  #hud-track { left: 50%; transform: translateX(-50%); bottom: 24px; font-size: 13px;
    font-weight: 700; letter-spacing: 2px; color: #8fa5bd; text-shadow: 0 1px 3px #000; }

  #finish-panel { top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(8, 12, 18, .88); border: 1px solid #29415a; border-radius: 12px;
    padding: 28px 44px; text-align: center; display: none; }
  #finish-panel h1 { margin: 0 0 12px; font-size: 34px; color: #ffd34d; }
  #finish-panel .rows { font-size: 15px; line-height: 1.9; color: #cfe0f2; }
  #finish-panel .again { margin-top: 16px; font-size: 13px; color: #8fa5bd; }

  #pause-panel { top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(8, 12, 18, .88); border: 1px solid #29415a; border-radius: 12px;
    padding: 30px 52px; text-align: center; display: none; pointer-events: auto; }
  #pause-panel h1 { margin: 0 0 18px; font-size: 36px; color: #ffd34d; letter-spacing: 4px; }
  #pause-panel .btn { display: block; width: 100%; margin: 10px 0; padding: 12px 26px;
    font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #fff; background: #1c2c3e;
    border: 1px solid #3d5a7c; border-radius: 8px; cursor: pointer; transition: background .12s; }
  #pause-panel .btn:hover { background: #2a4258; }
  #pause-panel .keys { margin-top: 16px; font-size: 12px; color: #7a8ba0; line-height: 1.8; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud-speed" class="hud">
  <div id="speed-value">0</div>
  <small>KM/H</small>
  <div id="boost-flag">BOOST!</div>
</div>

<div id="hud-drift" class="hud">
  <div id="drift-score">0</div>
  <div id="drift-combo">x1.0</div>
</div>

<div id="hud-lap" class="hud">
  <div id="lap-counter">LAP 1/3</div>
  <div id="lap-times"></div>
</div>

<div id="hud-pos" class="hud">1st<small>POSITION</small></div>

<div id="hud-msg" class="hud"></div>

<div id="hud-map" class="hud"><canvas id="map-canvas" width="170" height="170"></canvas></div>

<div id="hud-track" class="hud">APEX CIRCUIT</div>

<div id="hud-hint" class="hud">
  <b>WASD / Arrows</b> drive &nbsp; <b>Space</b> handbrake &nbsp; <b>S</b> airbrake<br>
  <b>R</b> reset &nbsp; <b>L</b> line &nbsp; <b>G</b> ghost &nbsp; <b>T</b> track &nbsp; <b>Esc</b> pause
</div>

<div id="finish-panel" class="hud">
  <h1>RACE FINISHED</h1>
  <div class="rows" id="finish-rows"></div>
  <div class="again"><b>Enter</b> restart &nbsp;·&nbsp; <b>T</b> next track</div>
</div>

<div id="pause-panel" class="hud">
  <h1>PAUSED</h1>
  <button class="btn" id="pause-resume">RESUME&nbsp;&nbsp;[ESC]</button>
  <button class="btn" id="pause-restart">RESTART RACE&nbsp;&nbsp;[ENTER]</button>
  <button class="btn" id="pause-track">CHANGE TRACK&nbsp;&nbsp;[T]</button>
  <div class="keys">WASD/Arrows drive · Space handbrake · S airbrake<br>R checkpoint · L line · G ghost</div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
